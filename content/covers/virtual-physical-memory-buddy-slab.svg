<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#18283d" stroke-width="1"/></pattern>
  <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f08a4b"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#43c2b8"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa8ba"/></marker>
  <style>
    .t1{font:600 60px 'IBM Plex Sans Condensed';fill:#e9eef5;letter-spacing:-0.5px}
    .t2{font:500 30px 'IBM Plex Sans Condensed';fill:#9aa8ba}
    .chip{font:500 18px 'IBM Plex Mono';fill:#f08a4b}
    .brand{font:600 22px 'IBM Plex Sans Condensed';fill:#e9eef5}
    .l{font:500 17px 'IBM Plex Sans';fill:#e9eef5}
    .s{font:400 14px 'IBM Plex Sans';fill:#9aa8ba}
    .m{font:500 15px 'IBM Plex Mono';fill:#e9eef5}
    .ms{font:400 13px 'IBM Plex Mono';fill:#9aa8ba}
    .box{fill:#15253a;stroke:#34465d;stroke-width:1.5}
    .cu{fill:#3a2416;stroke:#f08a4b;stroke-width:2}
    .te{fill:#123331;stroke:#43c2b8;stroke-width:2}
    .amb{fill:#352711;stroke:#f2b65a;stroke-width:2}
    .lc{fill:none;stroke:#f08a4b;stroke-width:2.5}
    .lt{fill:none;stroke:#43c2b8;stroke-width:2.5}
    .lm{fill:none;stroke:#9aa8ba;stroke-width:1.8}
    .dash{stroke-dasharray:7 6}
    .tc{fill:#f08a4b} .tt{fill:#43c2b8} .ta{fill:#f2b65a}
  </style>
</defs>
<rect width="1200" height="630" fill="#0f1b2d"/>
<rect width="1200" height="630" fill="url(#g)"/>
<rect x="0" y="0" width="1200" height="6" fill="#f08a4b"/>
<text class="chip" x="64" y="88">LNX  /  Memory management</text>
<text class="t1" x="64" y="168">Virtual vs</text>
<text class="t1" x="64" y="236">Physical Memory</text>
<text class="t2" x="64" y="292">From malloc() and mmap() down to RAM</text>
<g transform="translate(64,548)">
  <g transform="rotate(-8 8 14)"><rect x="0" y="0" width="7" height="18" rx="2" fill="#f08a4b"/><rect x="11" y="4" width="7" height="11" rx="2" fill="#f08a4b"/><rect x="0" y="22" width="7" height="11" rx="2" fill="#f08a4b"/><rect x="11" y="19" width="7" height="18" rx="2" fill="#f08a4b"/></g>
  <text class="brand" x="32" y="26">LowLevel <tspan fill="#f08a4b">Labs</tspan></text>
  <text class="s" x="190" y="25">lowlevellabs.in</text>
</g>

<g transform="translate(610,52)">
  <rect class="te" x="0" y="0" width="300" height="54" rx="8"/><text class="m" x="18" y="24">malloc(256 MB)</text><text class="s" x="18" y="44">glibc: large → mmap()</text>
  <rect class="te" x="0" y="78" width="300" height="54" rx="8"/><text class="m" x="18" y="102">mmap()  →  VMA</text><text class="s" x="18" y="122">address space reserved, no RAM yet</text>
  <rect class="box" x="0" y="156" width="300" height="54" rx="8"/><text class="m" x="18" y="180">first write to p[0]</text><text class="s" x="18" y="200">MMU: no entry → page fault</text>
  <rect class="cu" x="0" y="234" width="300" height="54" rx="8"/><text class="m" x="18" y="258">buddy allocator</text><text class="s" x="18" y="278">one zeroed 4 KB page frame</text>
  <rect class="cu" x="0" y="312" width="300" height="54" rx="8"/><text class="m" x="18" y="336">write PTE, retry</text><text class="s" x="18" y="356">VA now maps to PA</text>
  <path class="lt" d="M150 54v20" marker-end="url(#at)"/>
  <path class="lt" d="M150 132v20" marker-end="url(#at)"/>
  <path class="lc" d="M150 210v20" marker-end="url(#ac)"/>
  <path class="lc" d="M150 288v20" marker-end="url(#ac)"/>
  <text class="s" x="0" y="400">virtual: what your pointer holds</text>

  <g transform="translate(350,140)">
    <text class="s" x="0" y="0">physical RAM</text>
    <rect x="0" y="14" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="36" y="14" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="72" y="14" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="108" y="14" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="144" y="14" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="0" y="50" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="36" y="50" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="72" y="50" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="108" y="50" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="144" y="50" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="0" y="86" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="36" y="86" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="72" y="86" width="30" height="30" rx="3" fill="#3a2416" stroke="#f08a4b" stroke-width="2"/><rect x="108" y="86" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="144" y="86" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="0" y="122" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="36" y="122" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="72" y="122" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="108" y="122" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="144" y="122" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="0" y="158" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="36" y="158" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="72" y="158" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="108" y="158" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="144" y="158" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="0" y="194" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="36" y="194" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="72" y="194" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="108" y="194" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/><rect x="144" y="194" width="30" height="30" rx="3" fill="#15253a" stroke="#34465d" stroke-width="1.2"/>
    <text class="ms" x="0" y="252">4 KB frames</text>
  </g>
  <path class="lc dash" d="M300 339C330 339 330 268 372 244" marker-end="url(#ac)"/>
  <rect class="box" x="350" y="0" width="186" height="104" rx="8"/>
  <text class="m" x="366" y="30">VA → MMU → PA</text>
  <text class="s" x="366" y="56">slab carves small</text>
  <text class="s" x="366" y="76">kernel objects from</text>
  <text class="s" x="366" y="96">buddy pages</text>
</g>
</svg>
